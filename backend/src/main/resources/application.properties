spring.application.name=pena

# Base de datos (en local usa los valores por defecto; en el servidor se ponen variables de entorno)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pena_informales?createDatabaseIfNotExist=true&serverTimezone=Europe/Madrid}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Seguridad
app.jwt.secret=${JWT_SECRET:cambia-esta-clave-en-produccion-por-una-larga-y-aleatoria-1234567890}
app.jwt.horas-validez=${JWT_HORAS:720}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin1234}

# Minutos que tiene un miembro para deshacer su propio apunte
app.consumo.minutos-deshacer=5

# Avisos
# Contacto que se envía a los servicios de notificaciones (obligatorio para Apple). Pon un email real de la peña.
app.contacto=${APP_CONTACTO:mailto:pena.informales@example.com}

# Email (opcional). Sin MAIL_HOST los correos solo se escriben en el log.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
